name: Deploy to GitHub Pages

# Testbetrieb: Die Seite laeuft unter der Pages-Adresse, damit man sie ansehen
# kann. Bestellen, Anmelden und der Oeffnungsstatus funktionieren dabei NICHT -
# config.js zeigt auf einen Render-Dienst, den es noch nicht gibt. Alle drei
# Seiten tragen deshalb noindex.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
