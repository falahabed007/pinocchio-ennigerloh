name: Deploy to GitHub Pages

# Auto-Deploy ist bewusst abgeschaltet, solange der Standort nicht live darf:
# das Impressum traegt noch Platzhalter, und das Repo ist privat (Pages braucht
# dafuer einen bezahlten Plan, der Lauf wuerde also ohnehin scheitern).
# Wieder anschalten heisst: die zwei Zeilen unter "on:" entkommentieren.
on:
  # push:
  #   branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
